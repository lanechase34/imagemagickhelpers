name: Test Suite

permissions:
  contents: read
  checks: write
  pull-requests: write

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR so stale pushes don't hold runners
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
  
    strategy:
      fail-fast: false
      matrix:
        cfengine: [ "boxlang-cfml@1", "lucee@6", "lucee@7", "adobe@2025" ]

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: "temurin"
          java-version: "21"
      
      - name: Setup CommandBox CLI
        uses: Ortus-Solutions/setup-commandbox@7be599028dcf77743854b2f6c720b15316f39be2 # v2.0.1
        with:
          version: latest

      - name: Cache CommandBox Downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.CommandBox/artifacts
            ~/.CommandBox/serverJREs
          key: commandbox-${{ runner.os }}-${{ matrix.cfengine }}-${{ hashFiles('box.json', format('server-{0}.json', matrix.cfengine)) }}
          restore-keys: |
            commandbox-${{ runner.os }}-${{ matrix.cfengine }}-

      - name: Resolve Latest ImageMagick Release
        id: magick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Authenticated request avoids the shared-IP rate limit on unauthenticated API calls.
          # Token is empty under act unless passed in, and an empty bearer token gets a 401
          AUTH=()
          if [ -n "${GH_TOKEN:-}" ]; then
            AUTH=(-H "Authorization: Bearer $GH_TOKEN")
          fi
          RELEASE=$(curl -fsSL "${AUTH[@]}" \
            https://api.github.com/repos/ImageMagick/ImageMagick/releases/latest)
          echo "tag=$(echo "$RELEASE" | jq -r '.tag_name')" >> "$GITHUB_OUTPUT"
          echo "url=$(echo "$RELEASE" | jq -r 'first(.assets[] | select(.name | test("gcc-x86_64.AppImage$")) | .browser_download_url)')" >> "$GITHUB_OUTPUT"

      - name: Cache ImageMagick
        id: magick-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/magick-appimage
          key: imagemagick-${{ runner.os }}-${{ steps.magick.outputs.tag }}

      - name: Install ImageMagick
        env:
          ASSET_URL: ${{ steps.magick.outputs.url }}
          CACHE_HIT: ${{ steps.magick-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail

          # Only hit apt when a runtime library is actually missing from the runner image
          LIBS="libfontconfig1 libfreetype6 libx11-6 libharfbuzz0b libfribidi0"
          MISSING=$(for LIB in $LIBS; do dpkg -s "$LIB" >/dev/null 2>&1 || echo "$LIB"; done)
          if [ -n "$MISSING" ]; then
            sudo apt-get update
            sudo apt-get install -y $MISSING
          fi

          # Pull the official portable ImageMagick 7 AppImage and extract it, unless restored from cache
          if [ "$CACHE_HIT" != "true" ]; then
            curl -fsSL -o /tmp/magick.AppImage "$ASSET_URL"
            chmod +x /tmp/magick.AppImage
            (cd /tmp && ./magick.AppImage --appimage-extract >/dev/null)
            rm -rf ~/magick-appimage
            mv /tmp/squashfs-root ~/magick-appimage
          fi
          sudo ln -sf ~/magick-appimage/AppRun /usr/local/bin/magick

          echo "IMAGEMAGICKPATH=$(command -v magick)" >> "$GITHUB_ENV"

          # Fail fast with a clear message if the extracted AppImage is missing delegate
          # coders, rather than letting it surface later as cryptic per-test failures.
          # Capture the list once - piping magick into grep -q under pipefail flakes when grep exits
          # early and magick dies of SIGPIPE writing the rest of the list
          FORMATS=$(magick -list format)
          for FORMAT in JPEG PNG WEBP GIF HEIC; do
            if ! grep -qi "^\s*${FORMAT}" <<< "$FORMATS"; then
              echo "::error::ImageMagick install is missing the ${FORMAT} delegate coder - the AppImage extraction likely failed or was truncated"
              echo "$FORMATS"
              exit 1
            fi
          done

      - name: Setup Environment For Testing Process
        run: |
          cat > .env << 'EOL'
          ENVIRONMENT=development
          IMAGEMAGICKPATH=${{ env.IMAGEMAGICKPATH }}
          EOL

      - name: Install Dependencies
        run: box install
        timeout-minutes: 10

      - name: Start ${{ matrix.cfengine }} Server
        run: |
          box server start serverConfigFile="server-${{ matrix.cfengine }}.json" --noSaveSettings --debug

      - name: Wait for Server to be Ready
        run: |
          echo "Waiting for server to start..."
          for i in {1..60}; do
            if curl -sf http://localhost:60299 > /dev/null 2>&1; then
              echo "Server is ready!"
              exit 0
            fi
            echo "Attempt $i: Server not ready yet..."
            sleep 2
          done
          echo "Server failed to start"
          box server log serverConfigFile="server-${{ matrix.cfengine }}.json"
          exit 1

      - name: Run Tests
        id: run_tests
        run: |
          mkdir -p tests/results
          box testbox run --verbose outputFile="tests/results/test-results" outputFormats="json,antjunit" \
            || echo "TESTS_FAILED=true" >> $GITHUB_ENV

      - name: Display Test Results
        if: always()
        run: |
          if [ -f "tests/results/test-results.json" ]; then
            echo "=== Test Results Summary ==="
            cat tests/results/test-results.json | jq -r '
              "Total Bundles: \(.totalBundles)",
              "Total Suites: \(.totalSuites)", 
              "Total Specs: \(.totalSpecs)",
              "Total Pass: \(.totalPass)",
              "Total Fail: \(.totalFail)",
              "Total Error: \(.totalError)",
              "Total Skipped: \(.totalSkipped)"
            '
          else
            echo "No test results found!"
            ls -la tests/results/ || echo "Results directory doesn't exist"
          fi

      - name: Publish Test Reports
        uses: mikepenz/action-junit-report@e08919a3b1fb83a78393dfb775a9c37f17d8eea6 # v6.0.1
        # Skipped under act (sets ACT=true) since there's no GitHub token or check run to publish to locally
        if: always() && !env.ACT
        with:
          report_paths: |
            tests/results/**/*.xml
          check_name: "TestBox Report ${{ matrix.cfengine }}"
          include_passed: false
          fail_on_failure: true
          require_tests: true
          detailed_summary: true

      - name: Upload Test Results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results-${{ matrix.cfengine }}
          path: |
            tests/results/
            tests/results/*.json
            tests/results/*.xml
          retention-days: 30
        continue-on-error: true

      - name: Stop Server
        if: always()
        run: |
          box server stop serverConfigFile="server-${{ matrix.cfengine }}.json"
        continue-on-error: true

      - name: Fail if tests failed
        if: env.TESTS_FAILED == 'true'
        run: |
          echo "TestBox run failed"
          exit 1
